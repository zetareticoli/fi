<footer class="lg:ml-48 px-6 lg:px-10 pb-10 mt-8">
  <div class="hairline pt-8">
    <div class="flex flex-col sm:flex-row justify-between gap-6">
      <div class="flex flex-col gap-2">
        <p class="text-sm text-muted leading-relaxed max-w-md mb-8">
          <span class="text-muted-foreground">Designed and built by {{ site.author.name }}</span>. <br>
          Powered by Jekyll. Set in Mona Sans, Inter and JetBrains Mono. <br> No cookies, no trackers.
        </p>
        <p class="uppercase font-mono text-xs text-muted">© {{ 'now' | date: '%Y' }} {{ site.author.name }}</p>
      </div>
      <div class="flex flex-col gap-2 sm:text-right">
        <span class="meta-tag">[CONNECT]</span>
        <div class="flex flex-col gap-1">
          <a href="mailto:{{ site.email }}" class="text-sm text-muted-foreground hover:text-foreground transition-colors">
            {{ site.author.email }}
          </a>
          {% for social in site.author.social %}
          <a href="{{ social.url }}" target="_blank" rel="noopener noreferrer" class="text-sm text-muted-foreground hover:text-foreground transition-colors">{{ social.name }}</a>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</footer>
