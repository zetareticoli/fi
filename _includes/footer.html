<footer class="lg:ml-48 px-6 lg:px-10 pb-16 mt-8">
  <div class="hairline pt-8">
    <div class="flex flex-col sm:flex-row justify-between gap-6">
      <div class="flex flex-col gap-2">

        <p class="text-sm text-muted leading-relaxed max-w-md">
          Designed and built by {{ site.author.name }}.
          Set in Inter and JetBrains Mono. No cookies, no trackers.
        </p>
      </div>
      <div class="flex flex-col gap-2 sm:text-right">
        <span class="meta-tag">[CONNECT]</span>
        <div class="flex flex-col gap-1">
          <a href="mailto:{{ site.email }}" class="text-sm text-muted-foreground hover:text-foreground transition-colors">
            {{ site.author.email }}
          </a>
          {% for social in site.author.social %}
          <a href="{{ social.url }}" target="_blank" rel="noopener noreferrer" class="text-sm text-muted-foreground hover:text-foreground transition-colors">{{ social.name }}</a>
          {% endfor %}
        </div>
      </div>
    </div>
    <p class="meta-tag mt-10">© {{ 'now' | date: '%Y' }} {{ site.author.name }}</p>
  </div>
</footer>
