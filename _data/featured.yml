# Ogni progetto dichiara quante colonne (su 12) e righe occupa nella work-grid,
# per breakpoint (md = tablet, lg = desktop, xl = desktop largo).
# Un breakpoint non specificato eredita il valore del breakpoint precedente
# (xl -> lg -> md). Su mobile il layout è sempre impilato a colonna singola.
