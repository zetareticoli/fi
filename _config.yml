title: "Francesco Improta — Design Lead & Design Systems Expert"
name: Francesco Improta
description: Senior designer with two decades of experience designing products for government, big companies and small businesses.
image: /img/social/default-og.webp

author:
  name: Francesco Improta
  email: me@francescoimprota.com
  social:
    - name: LinkedIn
      url: https://www.linkedin.com/in/francescoimprota/
    - name: GitHub
      url: https://github.com/zetareticoli
    - name: X
      url: https://x.com/zetareticoli

url: https://francescoimprota.com
baseurl: ""
calcom: francesco-improta/30min
lang: en

permalink: pretty
kramdown:
  input: GFM

collections:
  work:
    output: true
  workshops:
    output: true
    permalink: /workshops/:path

defaults:
  - scope: { path: "", type: "posts" }
    values:
      layout: post
      excerpt_separator: "<!--more-->"
  - scope: { path: "", type: "work" }
    values:
      layout: work

plugins:
  - jekyll-sitemap

sass:
  style: compressed

theme-color-attr: "#111A23"
ms-tile-color: "#111A23"
date_format: "%b %-d, %Y"
twitter_username: zetareticoli

var_your_email: Your email
var_your_message: Your message

exclude:
  - vendor
  - node_modules
  - css/tw.css
  - .cursor
