<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" fill="none">
  <title>Hero background — editable interface inventory</title>
  <desc>Vector reconstruction of the supplied reference. Main objects and their internal UI pieces are arranged in named groups for individual editing in Figma.</desc>

  <defs>
