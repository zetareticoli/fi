---
layout: default
---
<article class="min-h-screen">
  <!-- Back nav -->
  <div class="px-6 lg:px-10 pt-10 lg:pt-14">
    <a href="{{ '/writing' | relative_url }}" class="inline-flex items-center gap-2 text-sm text-muted-foreground hover:text-foreground transition-colors">
      ← Writing
    </a>
  </div>

  <!-- Header -->
  <section class="px-6 lg:px-10 pt-8 pb-12 lg:pb-16">
    <div class="max-w-2xl">
      {% if page.tag %}<span class="meta-tag block mb-4">[{{ page.tag }}]</span>{% endif %}
      <h1 class="font-heading text-3xl sm:text-4xl lg:text-5xl font-bold leading-tight">
        {{ page.title }}
      </h1>
      <div class="flex items-center gap-4 mt-6">
        <span class="meta-tag">{{ page.date | date: "%-d %B %Y" }}</span>
        {% if page.read_time %}<span class="text-border">·</span><span class="meta-tag">{{ page.read_time }}</span>{% endif %}
        {% if page.category %}<span class="text-border">·</span><span class="meta-tag">{{ page.category }}</span>{% endif %}
      </div>
    </div>
  </section>

  <div class="mx-6 lg:mx-10 hairline"></div>

  <!-- Body -->
  <section class="px-6 lg:px-10 py-12 lg:py-16">
    <div class="max-w-2xl prose prose-sm prose-neutral dark:prose-invert
                prose-headings:font-heading prose-headings:font-semibold prose-headings:tracking-tight
                prose-p:text-muted-foreground prose-p:leading-relaxed prose-p:text-base
                prose-h2:text-xl prose-h2:mt-10 prose-h2:mb-3
                prose-strong:font-medium prose-li:leading-relaxed">
      {{ content }}
    </div>
  </section>

  <div class="mx-6 lg:mx-10 hairline"></div>

  <!-- Footer nav -->
  <section class="px-6 lg:px-10 py-10 lg:py-14">
    <a href="{{ '/writing' | relative_url }}" class="inline-flex items-center gap-2 text-sm text-muted-foreground hover:text-foreground transition-colors">
      ← Back to all writing
    </a>
  </section>
</article>
